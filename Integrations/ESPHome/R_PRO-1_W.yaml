# Legacy WiFi-variant shim: builds the unified firmware but keeps the original
# device/project name and firmware-w/ manifest path so fielded devices keep updating.
# New installs should use R_PRO-1.yaml.

substitutions:
  stable_manifest_dir: "firmware-w"

esphome:
  name: "apollo-r-pro-1-w"
  project:
    name: "ApolloAutomation.R-PRO-1-W"
    version: ${version}

dashboard_import:
  package_import_url: github://ApolloAutomation/R_PRO-1/Integrations/ESPHome/R_PRO-1_W.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
