# Legacy Ethernet-variant shim: builds the unified firmware but keeps the original
# device/project name and firmware-e/ manifest path so fielded devices keep updating.
# New installs should use R_PRO-1.yaml.

substitutions:
  stable_manifest_dir: "firmware-e"
  # Keep WiFi off on the first boot after upgrading from the Ethernet-only firmware
  ethernet_expected_default: "true"

esphome:
  name: "apollo-r-pro-1-eth"
  project:
    name: "ApolloAutomation.R-PRO-1-ETH"
    version: ${version}

dashboard_import:
  package_import_url: github://ApolloAutomation/R_PRO-1/Integrations/ESPHome/R_PRO-1_ETH.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
